<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Page not found</title>
  <style>
    /* For an address that isn't anything, or something that's gone (or
       belongs to another household): ApplicationController#not_found, and
       Rails for unknown routes in production. Standalone like offline.html,
       so the colours repeat the --bg/--surface/--text/--accent tokens from
       application.css (light, then dark). */
    :root {
      color-scheme: light dark;
      --bg: #f4f6f9; --surface: #ffffff; --text: #16202c; --text-muted: #667487;
      --border: #e3e8ef; --accent: #4f6ef7; --accent-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f141b; --surface: #171d26; --text: #e7edf5; --text-muted: #94a3b8;
        --border: #28313d; --accent: #8ba4ff; --accent-fg: #0f141b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.55;
    }
    main {
      max-width: 26rem; text-align: center; background: var(--surface);
      border: 1px solid var(--border); border-radius: 16px; padding: 2rem 1.5rem;
    }
    svg { width: 3rem; height: 3rem; color: var(--accent); }
    .code { display: block; margin-top: 0.5rem; font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.08em; color: var(--text-muted); }
    h1 { font-size: 1.375rem; margin: 0.25rem 0 0.5rem; }
    p { margin: 0 0 1.25rem; color: var(--text-muted); }
    a {
      display: inline-flex; align-items: center; justify-content: center; min-height: 44px;
      padding: 0 1.25rem; border-radius: 999px; background: var(--accent); color: var(--accent-fg);
      font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/>
      <path d="M15 5.764v15"/><path d="M9 3.236v15"/>
    </svg>
    <span class="code">404</span>
    <h1>Nothing here</h1>
    <p>This page doesn't exist, or whatever was on it has been removed. It might also belong to a household you're not in.</p>
    <a href="/">Back home</a>
  </main>
</body>
</html>
