# Kamal 2+ deploy config for Whereabouts. Nothing here needs editing: copy
# .env.kamal.example to .env.kamal, fill it in, `source .env.kamal`, then
# run `bin/kamal setup` once and `bin/kamal deploy` after.
# No application secrets are needed: SECRET_KEY_BASE is generated on first
# boot and kept on the storage volume (see entrypoint.sh).

service: whereabouts
image: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME").downcase %>/whereabouts

servers:
  web:
    - <%= ENV.fetch("DEPLOY_SERVER") %>

ssh:
  user: <%= ENV.fetch("DEPLOY_SSH_USER", "root") %>

# kamal-proxy gets a Let's Encrypt certificate for this host and forwards
# to Thruster on port 3000 inside the container.
proxy:
  ssl: true
  host: <%= ENV.fetch("DEPLOY_DOMAIN") %>
  app_port: 3000
  healthcheck:
    path: /up

registry:
  server: <%= ENV.fetch("KAMAL_REGISTRY_SERVER", "ghcr.io") %>
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    # Email links use this; it also limits which Host headers are accepted.
    APP_URL: https://<%= ENV.fetch("DEPLOY_DOMAIN") %>
  # Optional. Uncomment and add values to .kamal/secrets to configure email
  # from here instead of Admin > Settings.
  # secret:
  #   - SMTP_HOST
  #   - SMTP_USER
  #   - SMTP_PASSWORD

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  setup-code: app exec --reuse "bin/rails setup:code"
  backup: app exec --reuse "bin/rails backup:create"
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# SQLite database, the generated secret, and uploads. Single app instance.
volumes:
  - "whereabouts_storage:/rails/storage"

# Bridge fingerprinted assets between deploys to avoid 404s mid-flight.
asset_path: /rails/public/assets

builder:
  arch: <%= ENV.fetch("DEPLOY_ARCH", "amd64") %>
  # Build on the server instead (faster from an arm64 laptop):
  # remote: ssh://<%= ENV.fetch("DEPLOY_SSH_USER", "root") %>@<%= ENV.fetch("DEPLOY_SERVER") %>
