# Kamal 2+ deploy config for family-status. Fill in the three values marked
# CHANGE ME, then run `bin/kamal setup` once and `bin/kamal deploy` after.
# No application secrets are needed: SECRET_KEY_BASE is generated on first
# boot and kept on the storage volume (see entrypoint.sh).

service: family-status
image: family-status

servers:
  web:
    - 192.168.0.1 # CHANGE ME: your server's IP or hostname

# kamal-proxy gets a Let's Encrypt certificate for this host and forwards
# to Thruster on port 3000 inside the container.
proxy:
  ssl: true
  host: status.example.com # CHANGE ME: a DNS name pointing at the server
  app_port: 3000
  healthcheck:
    path: /up

registry:
  # CHANGE ME: e.g. ghcr.io with your GitHub username, or Docker Hub.
  server: ghcr.io
  username: your-user
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    # Email links use this; it also limits which Host headers are accepted.
    APP_URL: https://status.example.com
  # Optional. Uncomment and add values to .kamal/secrets to configure email
  # from here instead of Admin > Settings.
  # secret:
  #   - SMTP_HOST
  #   - SMTP_USER
  #   - SMTP_PASSWORD

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  setup-code: app exec --reuse "bin/rails setup:code"
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# SQLite database, the generated secret, and uploads. Single app instance.
volumes:
  - "family_status_storage:/rails/storage"

# Bridge fingerprinted assets between deploys to avoid 404s mid-flight.
asset_path: /rails/public/assets

builder:
  arch: amd64
  # Build on the server instead (faster from an arm64 laptop):
  # remote: ssh://root@192.168.0.1
